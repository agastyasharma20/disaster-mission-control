name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile app/*.py app/api/*.py app/models/*.py app/services/*.py app/ws/*.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  edge-inference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-inference
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # detect.py's real deps (opencv/ultralytics) are heavy and not needed
      # to catch syntax errors -- byte-compile is enough for CI.
      - run: python -m py_compile simulate_drone.py detect.py
